name: DFRoot Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-debug:
    name: Build DFRoot Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Prepare scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./create-keystore.sh

      - name: Create keystore
        run: |
          ./create-keystore.sh

          echo "Checking generated keystore..."
          test -f app/keystore.jks
          ls -lh app/keystore.jks

      - name: Use Gradle 8.9 for AGP 8.7.3
        run: |
          sed -i \
            's/gradle-9\.7\.1-bin\.zip/gradle-8.9-bin.zip/' \
            gradle/wrapper/gradle-wrapper.properties

          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-35|build-tools;35.0.0|ndk;27.0.12077973|cmake;3.22.1' \
            || true

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DFRoot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14